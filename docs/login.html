<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CineMOOD Login</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:
                    linear-gradient(rgba(0,0,0,0.7),
                    rgba(0,0,0,0.7)),
                    url("https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?q=80&w=1974&auto=format&fit=crop") center/cover;
            overflow:hidden;
        }



        body::before{
            content:"";
            position:absolute;
            width:400px;
            height:400px;
            background:#66fcf1;
            border-radius:50%;
            filter:blur(140px);
            top:-100px;
            left:-100px;
            opacity:0.4;
        }

        body::after{
            content:"";
            position:absolute;
            width:400px;
            height:400px;
            background:#ff006e;
            border-radius:50%;
            filter:blur(140px);
            bottom:-120px;
            right:-100px;
            opacity:0.3;
        }



        .login-container{
            position:relative;
            width:380px;
            padding:40px;
            border-radius:25px;

            background:rgba(255,255,255,0.08);

            border:1px solid rgba(255,255,255,0.15);

            backdrop-filter:blur(18px);

            box-shadow:
                    0 8px 32px rgba(0,0,0,0.4);

            z-index:10;

            animation:fadeIn 1s ease;
        }

        @keyframes fadeIn{
            from{
                opacity:0;
                transform:translateY(30px);
            }

            to{
                opacity:1;
                transform:translateY(0);
            }
        }



        .logo{
            text-align:center;
            color:#66fcf1;
            font-size:34px;
            font-weight:600;
            margin-bottom:10px;
        }

        .tagline{
            text-align:center;
            color:#ccc;
            font-size:14px;
            margin-bottom:35px;
        }



        .input-box{
            margin-bottom:22px;
        }

        .input-box label{
            display:block;
            color:#ddd;
            margin-bottom:8px;
            font-size:14px;
        }

        .input-box input{
            width:100%;
            padding:14px;
            border:none;
            outline:none;

            border-radius:12px;

            background:rgba(255,255,255,0.08);

            color:white;

            font-size:15px;

            transition:0.3s;
        }

        .input-box input:focus{
            background:rgba(255,255,255,0.15);

            box-shadow:0 0 10px #66fcf1;
        }



        .login-btn{
            width:100%;
            padding:14px;

            border:none;
            border-radius:14px;

            background:#66fcf1;

            color:#000;

            font-size:16px;
            font-weight:600;

            cursor:pointer;

            transition:0.3s;
        }

        .login-btn:hover{
            transform:translateY(-3px);

            background:white;

            box-shadow:0 0 18px #66fcf1;
        }


        .bottom-text{
            margin-top:25px;
            text-align:center;
            color:#bbb;
            font-size:14px;
        }

        .bottom-text a{
            color:#66fcf1;
            text-decoration:none;
        }



        @media(max-width:450px){

            .login-container{
                width:90%;
                padding:30px;
            }

            .logo{
                font-size:28px;
            }
        }

    </style>
</head>

<body>

<div class="login-container">

    <div class="logo">🎬 CineMOOD</div>

    <div class="tagline">
        From Feelings to Films
    </div>

    <form onsubmit="login(event)">

        <div class="input-box">
            <label>Email</label>

            <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
            >
        </div>

        <div class="input-box">
            <label>Password</label>

            <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
            >
        </div>

        <button class="login-btn">
            Login
        </button>

    </form>

    <div class="bottom-text">
        Don't have an account?
        <a href="register.html">Register</a>
    </div>

</div>

<script>

    async function login(event){

        event.preventDefault();

        const email =
            document.getElementById("email").value;

        const password =
            document.getElementById("password").value;

        try{

            const response = await fetch(
                "http://localhost:8080/auth/login",
                {
                    method:"POST",
                    headers:{
                        "Content-Type":"application/json"
                    },
                    body:JSON.stringify({
                        email:email,
                        password:password
                    })
                }
            );

            const data = await response.text();

            alert(data);

            if(data.includes("Success")){

                localStorage.setItem(
                    "loggedInUser",
                    email
                );

                window.location.href = "muzhs.html";
            }

        }catch(error){

            alert("Unable to connect to the server.");
            console.log(error);

        }
    }

</script>

</body>
</html>
