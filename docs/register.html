<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register</title>

    <style>

        body{
            font-family:Poppins;
            background:#0b0c10;
            color:white;

            display:flex;
            justify-content:center;
            align-items:center;

            height:100vh;
        }

        .register-box{

            width:350px;

            padding:30px;

            background:#1f2833;

            border-radius:15px;
        }

        input{

            width:100%;

            padding:12px;

            margin:10px 0;

            border:none;

            border-radius:10px;
        }

        button{

            width:100%;

            padding:12px;

            border:none;

            background:#66fcf1;

            border-radius:10px;

            font-weight:bold;

            cursor:pointer;
        }

        button:hover{

            background:darkgray;
        }

    </style>
</head>
<body>

<div class="register-box">

    <h1>Create Account</h1>

    <form onsubmit="register(event)">

        <input
                type="email"
                id="email"
                placeholder="Email"
                required>

        <input
                type="password"
                id="password"
                placeholder="Password"
                required>

        <button type="submit">
            Register Now
        </button>

    </form>
</div>

    <script>

        async function register(event){

            event.preventDefault();

            const email =
                document.getElementById("email").value;

            const password =
                document.getElementById("password").value;

            const response = await fetch(
                "http://localhost:8080/auth/register",

                {

                    method:"POST",

                    headers:{
                        "Content-Type":"application/json"
                    },

                    body:JSON.stringify({

                        email:email,
                        password:password

                    })
                }
            );

            const data = await response.text();

            if(response.ok){
                alert(data);
                window.location.href="login.html";
            }else{
                alert(data);
            }

            window.location.href = "login.html";
        }

    </script>
</body>
</html>
